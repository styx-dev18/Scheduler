  "/health":
    get:
      summary: Health check
      tags:
      - Health
      responses:
        '200':
          description: AC10 service is healthy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
  "/health/live":
    get:
      summary: Liveness check
      tags:
      - Health
      responses:
        '200':
          description: AC10 process is alive
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
  "/health/ready":
    get:
      summary: Readiness check
      tags:
      - Health
      responses:
        '200':
          description: AC10 database is reachable and migrations are applied
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        '503':
          description: EC10 database is unavailable or migrations are pending
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
  "/api/v1/service-types":
    get:
      summary: List service types
      tags:
      - Service types
      parameters:
      - name: dealership_id
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: EC4 unknown or malformed dealership id
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                  meta:
                    type: object
                required:
                - success
                - data
                - meta
servers:
- url: http://localhost:3000
components:
  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true
        message:
          type: string
          nullable: true
      required:
      - success
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
          example:
            name:
            - can't be blank
      required:
      - type
      - title
      - status
      - code
      - detail
