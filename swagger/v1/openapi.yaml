  "/api/v1/dealerships/{dealership_id}/appointments":
    get:
      summary: List a dealership's appointments
      tags:
      - Dealerships
      parameters:
      - name: dealership_id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: technician_id
        in: query
        format: uuid
        required: false
        schema:
          type: string
      - name: service_bay_id
        in: query
        format: uuid
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        enum:
        - confirmed
        - in_progress
        - completed
        - cancelled
        - no_show
        schema:
          type: string
        description: ":\n * `confirmed` \n * `in_progress` \n * `completed` \n * `cancelled`
          \n * `no_show` \n "
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: AC8 schedule for the dealership
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                required:
                - success
                - data
                - meta
        '400':
          description: AC8 malformed dealership id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        '404':
          description: AC8 unknown dealership
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
  "/api/v1/dealerships":
    get:
      summary: List dealerships
      tags:
      - Dealerships
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: AC7 dealerships with opening hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                  meta:
                    type: object
                required:
                - success
                - data
                - meta
        '400':
          description: EC4 invalid page
          content:
