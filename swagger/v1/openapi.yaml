        in: query
        format: uuid
        required: true
        schema:
          type: string
      - name: service_type_id
        in: query
        format: uuid
        required: true
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: true
        schema:
          type: string
      responses:
        '200':
          description: bookable start times
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
