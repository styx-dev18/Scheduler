---
openapi: 3.0.3
info:
  title: Unified Service Scheduler API
  version: v1
paths:
  "/health":
    get:
      summary: Health check
      tags:
      - Health
      responses:
        '200':
          description: AC10 service is healthy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
servers:
- url: http://localhost:3000
components:
  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true
        message:
          type: string
          nullable: true
      required:
      - success
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
          example:
            name:
            - can't be blank
      required:
      - type
      - title
      - status
      - code
      - detail
