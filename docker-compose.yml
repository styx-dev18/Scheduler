services:
  web:
    build: .
    ports:
      - "3000:80"
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-only-placeholder-secret-key-base-do-not-use-in-production-0123456789abcdef0123456789abcdef}
      RAILS_LOG_TO_STDOUT: "1"
      DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler_api_production
    command: ["sh", "-c", "./bin/rails db:prepare db:seed && exec ./bin/thrust ./bin/rails server"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scheduler

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scheduler

volumes:
  pgdata:

networks:
  scheduler:
