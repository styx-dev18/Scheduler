$kind: http-request
name: Reschedule appointment
method: POST
url: '{{baseUrl}}/api/v1/appointments/{{appointmentId}}/reschedule'
order: 12000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "new_start_at": "{{rescheduleAt}}",
      "lock_version": {{lockVersion}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('start_at moved', () => {
        const data = pm.response.json().data;
        pm.expect(data.start_at).to.eql(pm.collectionVariables.get('rescheduleAt'));
        pm.collectionVariables.set('staleLockVersion', pm.collectionVariables.get('lockVersion'));
        pm.collectionVariables.set('lockVersion', String(data.lock_version));
      });
