$kind: http-request
name: Book back-to-back appointment
method: POST
url: '{{baseUrl}}/api/v1/appointments'
order: 8000
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: '{{idempotencyKey}}-back-to-back'
body:
  type: json
  content: |-
    {
      "customer_id": "{{rivalCustomerId}}",
      "vehicle_id": "{{rivalVehicleId}}",
      "service_type_id": "{{serviceTypeId}}",
      "dealership_id": "{{dealershipId}}",
      "start_at": "{{backToBackAt}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      pm.test('appointment is confirmed', () => {
        const data = pm.response.json().data;
        pm.expect(data.status).to.eql('confirmed');
        pm.collectionVariables.set('backToBackAppointmentId', data.id);
      });
