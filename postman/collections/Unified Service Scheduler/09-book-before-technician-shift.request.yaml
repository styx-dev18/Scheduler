$kind: http-request
name: Book before technician shift
method: POST
url: '{{baseUrl}}/api/v1/appointments'
order: 9000
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: '{{idempotencyKey}}-pre-shift'
body:
  type: json
  content: |-
    {
      "customer_id": "{{offShiftCustomerId}}",
      "vehicle_id": "{{offShiftVehicleId}}",
      "service_type_id": "{{serviceTypeId}}",
      "dealership_id": "{{dealershipId}}",
      "start_at": "{{preShiftAt}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 409', () => pm.response.to.have.status(409));
      pm.test('error code reports no technician', () => pm.expect(pm.response.json().error.code).to.eql('NO_TECHNICIAN'));
