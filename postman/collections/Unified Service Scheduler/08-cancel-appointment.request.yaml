$kind: http-request
name: Cancel appointment
method: POST
url: '{{baseUrl}}/api/v1/appointments/{{appointmentId}}/cancel'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "api-check"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('appointment is cancelled', () => pm.expect(pm.response.json().data.status).to.eql('cancelled'));
