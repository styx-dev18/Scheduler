$kind: http-request
name: Book conflicting appointment
method: POST
url: '{{baseUrl}}/api/v1/appointments'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: '{{idempotencyKey}}-rival'
body:
  type: json
  content: |-
    {
      "customer_id": "{{rivalCustomerId}}",
      "vehicle_id": "{{rivalVehicleId}}",
      "service_type_id": "{{serviceTypeId}}",
      "dealership_id": "{{dealershipId}}",
      "start_at": "{{startAt}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 409', () => pm.response.to.have.status(409));
      pm.test('error code reports no capacity', () => {
        pm.expect(pm.response.json().error.code).to.be.oneOf([ 'NO_BAY', 'NO_TECHNICIAN', 'NO_CAPACITY' ]);
      });
