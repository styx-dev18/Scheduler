$kind: collection
name: Unified Service Scheduler
description: Client-side harness for the booking flow. Books, replays, conflicts, inspects, reschedules and cancels appointments per run.
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      const today = new Date().toISOString().slice(0, 10);
      const storedDate = pm.collectionVariables.get('slotDate');
      if (!storedDate || storedDate <= today) {
        const day = 24 * 60 * 60 * 1000;
        const date = new Date(Date.now() + 7 * day);
        date.setUTCHours(0, 0, 0, 0);
        while (date.getUTCDay() !== 1) {
          date.setTime(date.getTime() + day);
        }
        pm.collectionVariables.set('slotDate', date.toISOString().slice(0, 10));
        pm.collectionVariables.set('idempotencyKey', pm.variables.replaceIn('{{$guid}}'));
      }
      const slotDate = pm.collectionVariables.get('slotDate');
      pm.collectionVariables.set('startAt', slotDate + 'T03:00:00Z');
      pm.collectionVariables.set('overlapAt', slotDate + 'T04:00:00Z');
      pm.collectionVariables.set('backToBackAt', slotDate + 'T05:00:00Z');
      pm.collectionVariables.set('preShiftAt', slotDate + 'T01:00:00Z');
      pm.collectionVariables.set('rescheduleAt', slotDate + 'T07:00:00Z');
